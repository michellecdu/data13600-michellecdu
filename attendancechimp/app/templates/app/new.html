<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1> Sign Up</h1>

    <form action="/app/createUser" method="post" class="form">
        {% csrf_token %}
    
        <div>
            <label for="user_name">Name:</label>
            <input type="text" id="user_name" name="user_name" placeholder="Enter your name" required>
        </div>

        <div>
            <label for="email">Enter your email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div>
            <label for="password">Enter your password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <fieldset>
            <legend>Select whether you are an instructor or a student:</legend>
                <div>
                    <input type="radio" id="instructor" name="is_student" value="0" checked />
                    <label for="instructor">Instructor</label>
                </div>

                <div>
                    <input type="radio" id="student" name="is_student" value="1" />
                    <label for="student">Student</label>
                </div>
            </div>
        </fieldset>

        <button type="submit">Sign Up</button>

    </form>
</body>
</html>
