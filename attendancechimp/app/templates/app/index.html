<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="bio">
        <h1>AttendanceChimp</h1>
        <p>Electronic class attendance tracking application for college instructors.</p>
        <hr>

    <div class="user">
        {% if user.is_authenticated %}
            <p> Logged in as: <strong class="username">{{ user.username }}</strong></p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Log Out</button>
            </form>
        {% else %}
            <p>Not logged in.</p>
        {% endif %}
    </div>

    <div class="time">
        <h2>Time: {{ time }}</h2>
    </div>
</body>
</html>
